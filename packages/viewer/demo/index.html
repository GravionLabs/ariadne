<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>&lt;ariadne-saga&gt; demo</title>
    <script type="module" src="../ariadne-viewer.js"></script>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 960px;
        margin: 2rem auto;
        padding: 0 1rem;
      }
      ariadne-saga {
        height: 480px;
        margin-bottom: 2rem;
      }
      /* Theming: the element reads --ariadne-* custom properties. */
      ariadne-saga.branded {
        --ariadne-bg: #fffbeb;
        --ariadne-step: #b45309;
      }
    </style>
  </head>
  <body>
    <h1>&lt;ariadne-saga&gt;</h1>

    <h2>Loaded with <code>src</code></h2>
    <pre>&lt;ariadne-saga src="order.saga.yaml"&gt;&lt;/ariadne-saga&gt;</pre>
    <ariadne-saga src="order.saga.yaml"></ariadne-saga>

    <h2>Dark, left to right, themed with CSS custom properties</h2>
    <ariadne-saga
      class="branded"
      src="order.saga.yaml"
      theme="light"
      direction="left-right"
    ></ariadne-saga>
    <ariadne-saga src="order.saga.yaml" theme="dark" direction="left-right"></ariadne-saga>

    <h2>Given as text with <code>source</code></h2>
    <ariadne-saga id="inline"></ariadne-saga>

    <h2>Errors</h2>
    <ariadne-saga src="missing.saga.yaml" style="height: 120px"></ariadne-saga>
    <ariadne-saga source="version: 99" style="height: 120px"></ariadne-saga>

    <script type="module">
      document.getElementById('inline').source = `version: 3
name: Light switch
direction: left-right
nodes:
  - { id: start-1, type: start, name: Off }
  - { id: on, type: state, name: On }
edges:
  - { id: e1, source: start-1, target: on, kind: forward, event: Flipped }
`;
      for (const viewer of document.querySelectorAll('ariadne-saga')) {
        viewer.addEventListener('error', (e) =>
          console.warn('ariadne-saga error:', e.detail.message),
        );
      }
    </script>
  </body>
</html>
