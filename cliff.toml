[changelog]
header = """# Changelog

All notable changes to GravionLabs/ariadne are documented here.
Versioning follows [Semantic Versioning](https://semver.org/).

---

"""
body = """
{% if version -%}
## [{{ version | trim_start_matches(pat="v") }}] — {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
## [Unreleased]
{% endif -%}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}\
- {% if commit.breaking %}⚠️ **Breaking**: {% endif -%}
{% if commit.scope %}**{{ commit.scope }}**: {% endif -%}
{{ commit.message | upper_first }}
{% endfor %}
{% endfor %}\n
"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = true
# A squash merge lists the commits of the pull request as "* type: message" lines in its body.
# Strip the bullet so each one is read as its own conventional commit.
commit_preprocessors = [
  { pattern = '(?m)^\* ', replace = "" },
]
commit_parsers = [
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Bug Fixes" },
  { message = "^doc", group = "Documentation" },
  { message = "^perf", group = "Performance" },
  { message = "^refactor", group = "Refactoring" },
  { message = "^revert", group = "Reverts" },
  { body = ".*security", group = "Security" },
  { message = "^chore|^ci|^style|^test|^build", skip = true },
]
protect_breaking_commits = false
filter_commits = true
# Only consider stable SemVer tags (ignores v0.x pre-release tags like v0.0.1-33)
tag_pattern = "v[0-9]+\\.[0-9]+\\.[0-9]+$"
topo_order = false
sort_commits = "oldest"
