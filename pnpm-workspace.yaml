packages:
  - 'packages/*'
  - 'apps/*'

# A dependency with an install script must be decided here, as `true` (it may run) or `false` (it may
# not), with a reason. pnpm 12 already refuses an undecided one (`pnpm install` fails with
# ERR_PNPM_IGNORED_BUILDS); it is set explicitly so a change of the default cannot loosen it.
# See CONTRIBUTING.md and docs/adr/0019-dependency-updates-and-supply-chain.md.
strictDepBuilds: true

# The pages of the documentation site are the files of `docs/`, outside any package, and VitePress
# compiles them to code that imports `vue`: it must be found from the top folder (apps/site).
publicHoistPattern:
  - vue

# VitePress 1.6.4 (latest stable; 2.x is alpha) depends on vite ^5.4, which has open Dependabot alerts
# (no patched 5.x; fixed in >=6.4.4, with esbuild >=0.25). @vitejs/plugin-vue 5.2.4 accepts vite ^6.
# Remove this override once VitePress 2 is stable (it uses vite 8). Issue #544.
# glob 13 (via mocha 12.0.3, vscode extension tests) and minimatch 10.2.6 (via eslint's @eslint/config-array) are
# affected by Dependabot alerts #39/#40 (fixed in glob 14.0.2 / minimatch 11.0.1). Neither parent has released a
# version using the fixed majors yet. Both are dev tooling only; the APIs used (glob(), Minimatch) are unchanged
# in the new majors (Node >=18). Remove once mocha and eslint depend on them. Issue #545.
overrides:
  glob: '^14.0.2'
  minimatch: '^11.0.1'
  'vitepress>vite': '^6.4.6'
  '@vitejs/plugin-vue>vite': '^6.4.6'

allowBuilds:
  # File watching of the Angular builds (`ng serve`, `ng build --watch`); the script selects the prebuilt binary.
  '@parcel/watcher': true
  # The platform binary of esbuild, which bundles the extension, the server, the CLI and the viewer, and runs in Angular's build.
  esbuild: true
  # The native key-value store of Angular's build cache; the script selects the prebuilt binary.
  lmdb: true
  # Optional native speed-up of msgpackr (used by lmdb); the script selects the prebuilt binary.
  msgpackr-extract: true
  # Only the prebuilt grammar (WASM) of tree-sitter-c-sharp is used; its native build is not needed.
  tree-sitter-c-sharp: false
  # Signs and verifies published extensions; packaging a .vsix does not need its native binary.
  '@vscode/vsce-sign': false

# 7 days, in minutes: a younger release reaches neither the lockfile nor an install (GravionLabs/ci#239).
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  # In the lockfile before the 7 days applied and younger than that on 2026-11-18; remove after 2026-11-20 (glob and minimatch: after 2026-11-19).
