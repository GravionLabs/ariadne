name: Pages

# Publishes the static build of the web app from main. Off until the repository variable
# DEPLOY_PAGES is set to "true" (and Settings → Pages → Source is "GitHub Actions"): a public
# site is the owner's decision.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: vars.DEPLOY_PAGES == 'true'
    name: Build and deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: GravionLabs/ci/node/setup@f2bce90da1f215b8da4da9fba22881e9255921d2 # main
        with:
          package-manager: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ariadne/web exec ng build --base-href /${{ github.event.repository.name }}/
      - run: cp apps/web/dist/ariadne/browser/index.html apps/web/dist/ariadne/browser/404.html
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: apps/web/dist/ariadne/browser
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
