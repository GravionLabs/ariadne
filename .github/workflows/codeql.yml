name: CodeQL

# Code scanning of the TypeScript and of the workflows themselves. Advanced setup (not GitHub's default
# setup), so the configuration is versioned with the code. Needs GitHub Code Security on the repository.
on:
  pull_request:
    branches: [main, 'release/**']
  push:
    branches: [main]
  schedule:
    - cron: '30 4 * * 2' # Tuesday morning (UTC): new queries find old code

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        # `csharp` joins when C# other than the generated samples exists (the dotnet/ folder, #506); it then
        # needs build-mode: none as well and is added to the required checks.
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          # Interpreted languages need no build.
          build-mode: none
          config-file: ./.github/codeql/codeql-config.yml
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}
