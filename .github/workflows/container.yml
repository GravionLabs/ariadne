name: Container

# The release publishes the image (see `release` in ci.yml). A pull request that touches the image or
# what goes into it only has to prove that the image builds and starts.
on:
  pull_request:
    branches: [main, 'release/**']
    paths:
      - Dockerfile
      - .dockerignore
      - compose.yaml
      - apps/**
      - packages/**
      - docs/examples/**
      - samples/sagas/**
      - samples/library/**
      - pnpm-lock.yaml
      - .github/workflows/container.yml

permissions:
  contents: read

jobs:
  image:
    name: Build and start the image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: ariadne:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: |
          docker run -d --name ariadne -p 8080:8080 ariadne:ci
          for i in $(seq 1 20); do curl -fs localhost:8080/health && curl -fs localhost:8080/ | grep -q "<app-root" && exit 0; sleep 1; done
          docker logs ariadne
          exit 1
