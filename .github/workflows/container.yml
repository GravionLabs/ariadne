name: Container

# The release publishes the image (see `release` in ci.yml). A pull request that touches the image or
# what goes into it only has to prove that the image builds and starts.
on:
  pull_request:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - compose.yaml
      - apps/**
      - packages/**
      - docs/examples/**
      - samples/sagas/**
      - samples/library/**
      - pnpm-lock.yaml
      - .github/workflows/container.yml

permissions:
  contents: read

jobs:
  image:
    name: Build and start the image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          tags: ariadne:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: |
          docker run -d --name ariadne -p 8080:8080 ariadne:ci
          for i in $(seq 1 20); do curl -fs localhost:8080/health && curl -fs localhost:8080/ | grep -q "<app-root" && exit 0; sleep 1; done
          docker logs ariadne
          exit 1
