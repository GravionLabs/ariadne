name: VS Code flakiness

# The integration tests drive a real window and can race the UI. Once a week they run five times
# without retries, so a test that needs its retry shows up here before it fails a pull request.
on:
  schedule:
    - cron: '0 22 * * 1' # Monday night (UTC)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    name: Run ${{ matrix.run }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        run: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - uses: GravionLabs/ci/node/setup@main
        with:
          package-manager: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter ariadne-vscode test:integration:ci
        env:
          ARIADNE_TEST_RETRIES: '0'
