name: PR base

# A PR into another feature branch is lost when that branch is squash-merged first: its commits
# never reach main. Allowed bases are main and release/* branches (a release branch is merged into
# main with a merge commit, so nothing is lost). Retarget other PRs (or merge them before their parent).
on:
  pull_request:
    types: [opened, reopened, edited, synchronize]

permissions: {}

jobs:
  base-is-main:
    name: Base is main or a release branch
    runs-on: ubuntu-latest
    steps:
      - name: Require main or a release branch as the base branch
        env:
          BASE: ${{ github.base_ref }}
          DEFAULT: ${{ github.event.repository.default_branch }}
        run: |
          case "$BASE" in
            "$DEFAULT" | release/*) ;;
            *)
              echo "::error::This PR targets '$BASE', not '$DEFAULT' or a release/* branch. If '$BASE' is squash-merged first, this work never reaches '$DEFAULT'. Retarget the PR to '$DEFAULT' or the current release branch."
              exit 1
              ;;
          esac
