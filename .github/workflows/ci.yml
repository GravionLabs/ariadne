name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch makes the running check obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  ci:
    name: Lint, build, test
    runs-on: ubuntu-latest
    steps:
      # Lint, build and test with one install and the pnpm store cached
      # (GravionLabs/ci: node/ci runs `pnpm run lint`, `build` and `test:ci`).
      - uses: GravionLabs/ci/node/ci@f2bce90da1f215b8da4da9fba22881e9255921d2 # main
        with:
          package-manager: pnpm

  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: GravionLabs/ci/node/setup@f2bce90da1f215b8da4da9fba22881e9255921d2 # main
        with:
          package-manager: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run format:check

  # The C# the generator writes must build against MassTransit (needs the .NET SDK, CI only).
  generated-csharp:
    name: Compile generated C#
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: GravionLabs/ci/node/setup@f2bce90da1f215b8da4da9fba22881e9255921d2 # main
        with:
          package-manager: pnpm
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.x
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ariadne/cli build
      - run: scripts/compile-generated.sh

  # The hot paths on generated large sagas, against the budgets of docs/specs/performance-budgets.md.
  # A benchmark that is over its budget fails; above 70% of it, it warns.
  perf:
    name: Performance budgets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: GravionLabs/ci/node/setup@f2bce90da1f215b8da4da9fba22881e9255921d2 # main
        with:
          package-manager: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm perf

  # The extension runs in a real VS Code (downloaded, headless under xvfb).
  vscode-extension:
    name: VS Code extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: GravionLabs/ci/node/setup@f2bce90da1f215b8da4da9fba22881e9255921d2 # main
        with:
          package-manager: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter ariadne-vscode test:integration:ci
      # Tests that passed only after a retry (see apps/vscode/DEVELOPING.md, "Flaky tests").
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: vscode-retries
          path: test-results/vscode-retries.json
          if-no-files-found: ignore

  # The extension as a .vsix, with the version of the release: built, and installed into a clean
  # VS Code to check that what was packed is enough to run. On main it is attached to the release.
  vsix:
    name: VS Code extension package
    runs-on: ubuntu-latest
    outputs:
      tag: v${{ steps.version.outputs.semver }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - id: version
        uses: GravionLabs/ci/versioning/determine-version@f2bce90da1f215b8da4da9fba22881e9255921d2 # main
        with:
          gitversion-config-file: GitVersion.yml
      - uses: GravionLabs/ci/node/setup@f2bce90da1f215b8da4da9fba22881e9255921d2 # main
        with:
          package-manager: pnpm
      - run: pnpm install --frozen-lockfile
      # The marketplace takes major.minor.patch only; a pre-release suffix of a branch build is dropped.
      - run: pnpm --filter ariadne-vscode package ${{ steps.version.outputs.major }}.${{ steps.version.outputs.minor }}.${{ steps.version.outputs.patch }}
      - run: pnpm --filter ariadne-vscode test:vsix:ci
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vsix
          path: apps/vscode/vsix/*.vsix
          if-no-files-found: error

  # The viewer as an npm package, with the version of the release: built, packed, and installed into an
  # empty project to check that what was packed is enough (the element in a DOM, the Angular wrapper,
  # the types). On main it is published to npm after the release.
  viewer-package:
    name: Viewer package
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.semver }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - id: version
        uses: GravionLabs/ci/versioning/determine-version@f2bce90da1f215b8da4da9fba22881e9255921d2 # main
        with:
          gitversion-config-file: GitVersion.yml
      - uses: GravionLabs/ci/node/setup@f2bce90da1f215b8da4da9fba22881e9255921d2 # main
        with:
          package-manager: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ariadne/viewer package ${{ steps.version.outputs.semver }}
      # The files of the package against their size budgets (docs/specs/performance-budgets.md).
      - run: pnpm --filter @ariadne/viewer size
      - run: pnpm --filter @ariadne/viewer test:package
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: viewer-package
          path: packages/viewer/npm/*.tgz
          if-no-files-found: error

  # The ariadne command as a tarball for the GitHub release (apps/cli/scripts/package.mjs): built with
  # the version of the release, then installed into an empty project and run, as a user would.
  cli-package:
    name: CLI package
    runs-on: ubuntu-latest
    outputs:
      tag: v${{ steps.version.outputs.semver }}
      version: ${{ steps.version.outputs.semver }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - id: version
        uses: GravionLabs/ci/versioning/determine-version@f2bce90da1f215b8da4da9fba22881e9255921d2 # main
        with:
          gitversion-config-file: GitVersion.yml
      - uses: GravionLabs/ci/node/setup@f2bce90da1f215b8da4da9fba22881e9255921d2 # main
        with:
          package-manager: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ariadne/cli package ${{ steps.version.outputs.semver }}
      - run: pnpm --filter @ariadne/cli test:package
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cli-package
          path: apps/cli/npm/*.tgz
          if-no-files-found: error

  # Every merge to main that passes the checks is a release (GravionLabs/ci docker-package):
  # GitVersion gives the version, the image is published to GHCR with the tags latest, 1, 1.0 and
  # 1.0.0, and a GitHub release v1.0.0 is created with notes from the Conventional Commits.
  release:
    name: Release
    needs: [ci, format, generated-csharp, perf, vscode-extension, vsix, viewer-package, cli-package]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: GravionLabs/ci/.github/workflows/docker-package.yml@f2bce90da1f215b8da4da9fba22881e9255921d2 # main
    with:
      # Lowercase: a registry rejects capitals, and `github.repository` (GravionLabs/ariadne) has them.
      image-name: gravionlabs/ariadne
      gitversion-config-file: GitVersion.yml
      cliff-config: cliff.toml
    secrets:
      registry-username: ${{ github.actor }}
      registry-token: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
      packages: write

  # The .vsix goes onto the release the job above created, so it can be downloaded and installed
  # without a marketplace (code --install-extension ariadne-vscode-<version>.vsix).
  vsix-release:
    name: Attach the extension to the release
    needs: [release, vsix]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: vsix
          path: vsix
      - run: gh release upload "${{ needs.vsix.outputs.tag }}" vsix/*.vsix --clobber --repo "${{ github.repository }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The command goes onto the release too, twice: with its version, and as ariadne-cli.tgz, so that
  # https://github.com/<repository>/releases/latest/download/ariadne-cli.tgz is always the newest
  # (npm install -g <that address>). The agent skill (skills/ariadne) points there.
  cli-release:
    name: Attach the CLI to the release
    needs: [release, cli-package]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: cli-package
          path: cli
      - run: |
          cp cli/ariadne-cli-*.tgz cli/ariadne-cli.tgz
          gh release upload "${{ needs.cli-package.outputs.tag }}" cli/*.tgz --clobber --repo "${{ github.repository }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # @ariadne/viewer goes to npm with the version of the release, when the repository variable
  # PUBLISH_NPM is 'true' (Settings > Secrets and variables > Actions > Variables); any other value, or
  # none, skips the job and the package stays a build artifact. The npm account and the NPM_TOKEN
  # secret (a token that may publish the @ariadne scope) are the owner's; without the secret the job
  # only says so.
  viewer-publish:
    name: Publish the viewer to npm
    needs: [release, viewer-package]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.PUBLISH_NPM == 'true'
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - if: env.NPM_TOKEN == ''
        run: echo "::notice::NPM_TOKEN is not set, so @ariadne/viewer ${{ needs.viewer-package.outputs.version }} was not published."
      - if: env.NPM_TOKEN != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: viewer-package
          path: viewer-package
      - if: env.NPM_TOKEN != ''
        uses: GravionLabs/ci/node/setup@f2bce90da1f215b8da4da9fba22881e9255921d2 # main
        with:
          package-manager: pnpm
      - if: env.NPM_TOKEN != ''
        run: |
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" >> ~/.npmrc
          pnpm publish viewer-package/*.tgz --access public --no-git-checks
