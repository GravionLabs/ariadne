# Adds new issues and pull requests to the GravionLabs project (https://github.com/users/GravionLabs/projects/17).
# GH_PAT is a classic PAT with the scopes `project` and `repo`; the GITHUB_TOKEN cannot write to a user-owned project.
# pull_request_target: Dependabot and fork PRs get the secret too; the job never checks out PR code.
name: Add to project

on:
  issues:
    types: [opened, reopened, transferred]
  pull_request_target:
    types: [opened, reopened]

permissions: {}

jobs:
  add-to-project:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/add-to-project@5afcf98fcd03f1c2f92c3c83f58ae24323cc57fd # v2.0.0
        with:
          project-url: https://github.com/users/GravionLabs/projects/17
          github-token: ${{ secrets.GH_PAT }}
