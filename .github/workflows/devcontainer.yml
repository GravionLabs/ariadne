name: Dev container

# The dev container has to keep matching CI: build it and run lint, the unit tests and the VS Code
# integration tests inside it when what it is made of changes.
on:
  pull_request:
    branches: [main, 'release/**']
    paths:
      - '.devcontainer/**'
      - '.nvmrc'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/devcontainer.yml'

concurrency:
  group: devcontainer-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  devcontainer:
    name: Dev container
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # 0.3.1900000450
        with:
          runCmd: pnpm lint && pnpm test && pnpm --filter ariadne-vscode test:integration:ci
