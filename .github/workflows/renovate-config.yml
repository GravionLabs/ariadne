name: Renovate config

# A typo in the Renovate configuration stops the dependency updates without a sound: check it.
on:
  pull_request:
    branches: [main, 'release/**']
    paths:
      - '.github/renovate.json5'
      - '.github/workflows/renovate-config.yml'

permissions:
  contents: read

jobs:
  validate:
    name: Validate the configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: GravionLabs/ci/node/setup@v1
        with:
          package-manager: pnpm
      # No install of the repository: the validator is a one-off tool.
      - run: pnpm dlx --package renovate renovate-config-validator --strict
