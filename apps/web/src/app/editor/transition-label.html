@if (rows() > 0) {
  <button
    type="button"
    class="card"
    [class.selected]="selected()"
    [attr.data-finding]="finding() ?? null"
    [style.height.px]="cardHeight()"
    [attr.aria-label]="'Transition' + (edge().event ? ' on ' + label() : '')"
    (click)="selectRequested.emit()"
  >
    @if (edge().event) {
      <span
        class="row event"
        [class.external]="kind() === 'external'"
        [class.timeout]="kind() === 'timeout'"
        [class.reply]="kind() === 'reply'"
        [class.fault]="kind() === 'fault'"
        [class.composite]="kind() === 'composite'"
        [class.slipCompleted]="kind() === 'slipCompleted'"
        [class.slipFaulted]="kind() === 'slipFaulted'"
        [title]="hint()"
      >
        <app-icon [name]="icon()" />
        <span class="text">{{ label() }}</span>
      </span>
      @if (edge().eventSource; as source) {
        <span class="row source">
          <app-icon name="external" />
          <span class="text">from {{ source }}</span>
        </span>
      }
    }
  </button>
}
@if (insertable()) {
  <app-add-step-button
    class="insert"
    [types]="insertTypes"
    label="Insert a state here"
    (picked)="inserted.emit($event)"
  />
}
@if (badge(); as badge) {
  <span class="path-badge" aria-hidden="true">{{ badge }}</span>
}
