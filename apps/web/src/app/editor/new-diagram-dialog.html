<dialog #dialog aria-labelledby="new-diagram-title" (close)="onClose()">
  <form class="dialog" (submit)="create($event)">
    <h2 id="new-diagram-title">New saga</h2>
    <label>
      <span>Name</span>
      <input
        type="text"
        placeholder="e.g. Order Saga"
        required
        [value]="name()"
        (input)="name.set($any($event.target).value)"
      />
    </label>
    <label>
      <span>Description <small>(optional)</small></span>
      <textarea
        rows="3"
        placeholder="What the saga does"
        [value]="description()"
        (input)="description.set($any($event.target).value)"
      ></textarea>
    </label>
    <div class="actions">
      <button type="button" class="menu-button" (click)="cancel()">Cancel</button>
      <button type="submit" class="menu-button primary" [disabled]="!valid()">Create</button>
    </div>

    @for (group of groups(); track group.id) {
      <section class="samples" [attr.aria-labelledby]="'samples-' + group.id">
        <h3 [id]="'samples-' + group.id">{{ group.title }}</h3>
        @for (sample of group.samples; track sample.id) {
          <button type="button" class="sample" (click)="pickSample(sample)">
            <span class="title">{{ sample.title }}</span>
            <span class="about">{{ sample.description }}</span>
          </button>
        }
      </section>
    }
  </form>
</dialog>
