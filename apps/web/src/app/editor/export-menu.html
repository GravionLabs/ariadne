<button
  #origin="cdkOverlayOrigin"
  type="button"
  class="menu-button"
  cdkOverlayOrigin
  aria-haspopup="menu"
  title="Export the diagram"
  [attr.aria-expanded]="isOpen()"
  [class.open]="isOpen()"
  (click)="toggle()"
>
  <app-icon name="saveAs" /><span class="label">Export</span
  ><app-icon class="chevron" name="expandMore" />
</button>

<ng-template
  cdkConnectedOverlay
  [cdkConnectedOverlayOrigin]="origin"
  [cdkConnectedOverlayOpen]="isOpen()"
  [cdkConnectedOverlayPositions]="positions"
  [cdkConnectedOverlayHasBackdrop]="true"
  [cdkConnectedOverlayPush]="true"
  [cdkConnectedOverlayViewportMargin]="12"
  cdkConnectedOverlayBackdropClass="cdk-overlay-transparent-backdrop"
  (backdropClick)="close()"
  (detach)="close()"
  (overlayKeydown)="onOverlayKeydown($event)"
>
  <section class="menu" role="menu" aria-label="Export">
    <div role="group" class="group" aria-label="Image">
      <header aria-hidden="true">Image</header>
      @for (entry of images; track entry.label) {
        <button type="button" role="menuitem" class="item" (click)="pick(entry)">
          <strong>{{ entry.label }}</strong
          ><small>{{ entry.hint }}</small>
        </button>
      }
    </div>
    <div role="group" class="group" aria-label="Mermaid">
      <header aria-hidden="true">Mermaid</header>
      @for (entry of mermaid; track entry.label) {
        <button type="button" role="menuitem" class="item" (click)="pick(entry)">
          <strong>{{ entry.label }}</strong
          ><small>{{ entry.hint }}</small>
        </button>
      }
    </div>
    <div role="group" class="group" aria-label="Documentation">
      <header aria-hidden="true">Documentation</header>
      @for (entry of documentation; track entry.label) {
        <button type="button" role="menuitem" class="item" (click)="pick(entry)">
          <strong>{{ entry.label }}</strong
          ><small>{{ entry.hint }}</small>
        </button>
      }
    </div>
  </section>
</ng-template>
