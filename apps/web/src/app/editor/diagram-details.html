<div class="head">
  <input
    type="text"
    class="name"
    aria-label="Saga name"
    placeholder="Untitled saga"
    [readOnly]="locked()"
    [value]="store.diagram().name ?? ''"
    (change)="setName($event)"
  />
  <button
    type="button"
    class="toggle"
    aria-controls="saga-description"
    [attr.aria-expanded]="expanded()"
    [class.filled]="!!store.diagram().description"
    [title]="expanded() ? 'Hide the description' : 'Show the description'"
    [attr.aria-label]="expanded() ? 'Hide the description' : 'Show the description'"
    (click)="toggle()"
  >
    <app-icon [name]="expanded() ? 'expandLess' : 'expandMore'" />
  </button>
</div>
@if (expanded()) {
  <textarea
    id="saga-description"
    class="description"
    rows="4"
    aria-label="Saga description"
    placeholder="What the saga does"
    [readOnly]="locked()"
    [value]="store.diagram().description ?? ''"
    (change)="setDescription($event)"
  ></textarea>

  <button
    type="button"
    class="code-toggle"
    aria-controls="saga-code"
    [attr.aria-expanded]="codeOpen()"
    (click)="toggleCode()"
  >
    <app-icon [name]="codeOpen() ? 'expandLess' : 'expandMore'" />
    <span>Code</span>
    @if (codeCount()) {
      <span class="count">{{ codeCount() }}</span>
    }
  </button>
  @if (codeOpen()) {
    <div id="saga-code" class="code" role="group" aria-label="Saga in code">
      @for (field of codeFields; track field.key) {
        <label>
          <span>{{ field.label }}</span>
          <input
            type="text"
            [attr.aria-label]="field.label"
            [placeholder]="field.placeholder"
            [readOnly]="locked()"
            [value]="saga()[field.key] ?? ''"
            (change)="setCode(field.key, $event)"
          />
        </label>
      }
      <small>Used when C# is generated, and filled in when it is imported.</small>
    </div>
  }
}
