<div class="head">
  <input
    type="text"
    class="name"
    aria-label="Saga name"
    placeholder="Untitled saga"
    [readOnly]="locked()"
    [value]="store.diagram().name ?? ''"
    (change)="setName($event)"
  />
  <button
    type="button"
    class="toggle"
    aria-controls="saga-description"
    [attr.aria-expanded]="expanded()"
    [class.filled]="!!store.diagram().description"
    [title]="expanded() ? 'Hide the description' : 'Show the description'"
    [attr.aria-label]="expanded() ? 'Hide the description' : 'Show the description'"
    (click)="toggle()"
  >
    <app-icon [name]="expanded() ? 'expandLess' : 'expandMore'" />
  </button>
</div>
@if (expanded()) {
  <textarea
    id="saga-description"
    class="description"
    rows="4"
    aria-label="Saga description"
    placeholder="What the saga does"
    [readOnly]="locked()"
    [value]="store.diagram().description ?? ''"
    (change)="setDescription($event)"
  ></textarea>
}
