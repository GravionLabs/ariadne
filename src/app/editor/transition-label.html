@if (rows() > 0) {
  <button
    type="button"
    class="card"
    [class.selected]="selected()"
    [style.height.px]="cardHeight()"
    [attr.aria-label]="'Transition' + (edge().event ? ' on ' + label() : '')"
    (click)="selectRequested.emit()"
  >
    @if (edge().event) {
      <span
        class="row event"
        [class.external]="external()"
        [title]="
          external()
            ? 'External event' + (edge().eventSource ? ' from ' + edge().eventSource : '')
            : 'Event published by this saga'
        "
      >
        <app-icon name="trigger" />
        <span class="text">{{ label() }}</span>
      </span>
      @if (edge().eventSource; as source) {
        <span class="row source">
          <app-icon name="external" />
          <span class="text">from {{ source }}</span>
        </span>
      }
    }
  </button>
}
@if (insertable()) {
  <app-add-step-button
    class="insert"
    [types]="insertTypes"
    label="Insert a state here"
    (picked)="inserted.emit($event)"
  />
}
